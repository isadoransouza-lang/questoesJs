<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média Escolar</title>
   
</head>
<body>

    <div class="container">
        <h1>Calculadora de Média Escolar</h1>

        <label>Nome do aluno:</label>
        <input type="text" id="nome" placeholder="Digite o nome">

        <label>Primeira nota:</label>
        <input type="number" id="nota1" >

        <label>Segunda nota:</label>
        <input type="number" id="nota2" >

        <label>Terceira nota:</label>
        <input type="number" id="nota3">

        <button onclick="calcularMedia()">Calcular Média</button>

        <div id="resultado"></div>
    </div>

    <script src="isis1.js"></script>
</body>
</html>
